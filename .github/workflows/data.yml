name: Update Hope Gap data

# Refreshes the planning tool's data twice a week from FRED, FHFA, BLS QCEW, Zillow and the
# Census Bureau, and publishes it to the gh-pages branch under /data.
# Group pay trends (Census QWI, large files, released quarterly) are rebuilt when they are more
# than 28 days old, on every push that changes build_groups.py, and on request.
# Any failed run, or any source that could not be refreshed, opens (or comments on) a GitHub issue.
# GitHub often starts scheduled runs several hours late; that is normal.
on:
  schedule:
    - cron: "17 13 * * 1,4"
  workflow_dispatch:
    inputs:
      groups:
        description: "Rebuild group pay trends (QWI) now"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/data.yml"]

permissions:
  contents: write
  issues: write

concurrency:
  group: hope-gap-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests openpyxl
      - name: Check out gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add pages origin/gh-pages
      - name: Build data
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python pipeline/build_data.py out pages/data
      - name: Publish
        run: |
          mkdir -p pages/data
          cp out/* pages/data/
          cd pages
          git config user.name "hope-gap-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Update Hope Gap data $(date -u +%F)" && git push origin HEAD:gh-pages; fi
      - name: Decide whether to rebuild group pay trends
        id: grp
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, datetime as dt
          ev = os.environ.get("GITHUB_EVENT_NAME", "")
          ask = os.environ.get("ASK", "false") == "true"
          p = "pages/data/groups.json"
          old = True
          if os.path.exists(p):
              try:
                  b = dt.datetime.strptime(json.load(open(p))["built"], "%Y-%m-%dT%H:%MZ")
                  old = (dt.datetime.utcnow() - b).days > 28
              except Exception:
                  old = True
          touched = False
          if ev == "push":
              try:
                  pay = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
                  touched = any("pipeline/build_groups.py" in (c.get("added", []) + c.get("modified", [])) for c in pay.get("commits", []))
              except Exception:
                  touched = True
          print("run=" + ("true" if (old or ask or touched) else "false"))
          EOF
        env:
          ASK: ${{ github.event.inputs.groups }}
      - name: Build group pay trends
        if: steps.grp.outputs.run == 'true'
        run: python pipeline/build_groups.py gout
      - name: Publish group pay trends
        if: steps.grp.outputs.run == 'true'
        run: |
          cd pages
          git pull --rebase origin gh-pages || true
          if [ -s ../gout/groups.json ] && python -c "import json,sys;d=json.load(open('../gout/groups.json'));sys.exit(0 if len(d.get('st',{}))>=40 else 1)"; then cp ../gout/groups.json data/; fi
          cp ../gout/groups_log.txt data/ || true
          git add data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Update Hope Gap group pay trends $(date -u +%F)" && git push origin HEAD:gh-pages; fi
      - name: Open a GitHub issue if anything went wrong
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'EOF'
          import json, os, re, subprocess
          probs = []
          if os.environ.get("JOB_STATUS") != "success":
              probs.append("The run did not finish (status: %s). Open the run below to see which step failed." % os.environ.get("JOB_STATUS"))
          try:
              m = re.search(r"^status (\{.*\})$", open("out/build_log.txt").read(), re.M)
              st = json.loads(m.group(1)) if m else {}
              if not m:
                  probs.append("The build log has no status line.")
              probs += ["Source '%s' was not refreshed (%s); the page keeps its previous data for it." % (k, v) for k, v in st.items() if v != "ok"]
          except FileNotFoundError:
              probs.append("No build log was written.")
          if os.path.exists("gout/groups_log.txt"):
              g = open("gout/groups_log.txt").read()
              if "FATAL" in g or not os.path.exists("gout/groups.json"):
                  probs.append("Group pay trends (Census QWI) failed to rebuild; the page keeps the previous groups.json.")
          if not probs:
              print("no problems")
              raise SystemExit(0)
          run = "%s/%s/actions/runs/%s" % (os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"])
          body = "\n".join("- " + p for p in probs) + "\n\nRun: " + run
          title = "Data refresh problem"
          num = subprocess.run(["gh", "issue", "list", "--state", "open", "--search", title + " in:title", "--json", "number", "--jq", ".[0].number"],
                               capture_output=True, text=True).stdout.strip()
          if num:
              subprocess.run(["gh", "issue", "comment", num, "--body", body], check=False)
          else:
              subprocess.run(["gh", "issue", "create", "--title", title, "--label", "bug", "--body",
                              body + "\n\nThis issue was opened automatically by the data workflow. Later problems are added as comments. Close it once fixed."], check=False)
          EOF
